<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: white;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        width: 100%;
        max-width: 500px;
        height: auto;
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.25);
        display: flex;
      }
      .container form {
        display: flex;
        flex-direction: column;
      }
      .container .kaina .fonas {
        background: rgb(122, 215, 122);
        padding: 14px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <form>
          <label
            >Ilgis
            <input type="number" name="Ilgis" />
          </label>
          <label
            >Plotis
            <input type="number" name="Plotis" />
          </label>
          <label
            >Gylis
            <input type="number" name="Gylis" />
          </label>
        </form>
      </div>
      <div class="kaina">
        <div class="fonas">
          <h2>Kaina:</h2>
          <div class="kaina">&euro; 0.00</div>
        </div>
      </div>
    </div>
  </body>
</html>
